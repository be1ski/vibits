<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1C1B1F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vibits" />
    <title>Vibits</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.ico">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      body {
        overflow: hidden;
        background-color: #1C1B1F;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #root {
        box-sizing: border-box;
        width: 100vw;
        height: 100dvh;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      @media (min-width: 900px) and (max-aspect-ratio: 1/1) {
        #root {
          width: auto;
          aspect-ratio: 9 / 19.5;
          height: 100vh;
          max-width: 100vw;
        }
      }
      @media (min-width: 900px) and (min-aspect-ratio: 1/1) {
        #root {
          width: auto;
          aspect-ratio: 9 / 7;
          height: 100vh;
          max-width: 100vw;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Override navigator.languages to support runtime locale changes
      var originalLanguages = Object.getOwnPropertyDescriptor(Navigator.prototype, "languages");
      Object.defineProperty(Navigator.prototype, "languages", {
        get: function() {
          if (window.__customLocale) {
            return [window.__customLocale];
          }
          return originalLanguages.get.call(this);
        }
      });
    </script>
    <script src="vibits.js"></script>
  </body>
</html>
