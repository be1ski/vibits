coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 93%

# Single source of truth for coverage exclusions
# These match the patterns previously in kover config
ignore:
  # Package-based exclusions
  - "**/di/**"
  - "**/generated/**"
  - "**/internal/**"
  - "**/platform/**"
  - "**/room/**"
  - "**/test/**"
  - "**/testing/**"
  - "**/ui/**"
  - "**/view/**"
  # File-based exclusions (TEA architecture classes)
  - "**/*Action.kt"
  - "**/*Dto.kt"
  - "**/*Effect.kt"
  - "**/*Features.kt"
  - "**/*State.kt"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  hide_project_coverage: false
