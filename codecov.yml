coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 80%

ignore:
  - "**/di/**"
  - "**/generated/**"
  - "**/platform/**"
  - "**/room/**"
  - "**/ui/**"
  - "**/view/**"
  - "**/*State.kt"
  - "**/*Action.kt"
  - "**/*Effect.kt"
  - "**/*Features.kt"
  - "**/*Dto.kt"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  hide_project_coverage: false
