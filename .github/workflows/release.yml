name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
  release:
    types: [created]

env:
  CHANGELOG_RELEASES_URL: https://api.github.com/repos/be1ski/vibits/releases

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      tag: ${{ steps.version.outputs.new_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get latest tag and calculate next version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "Latest tag: $LATEST_TAG"

          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"

          echo "New tag: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.new_tag }}" \
            --title "${{ steps.version.outputs.new_tag }}" \
            --generate-notes

  resolve-version:
    runs-on: ubuntu-latest
    needs: [create-release]
    if: always()
    outputs:
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Resolve version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ needs.create-release.outputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

  await-main-checks:
    runs-on: ubuntu-latest
    needs: [resolve-version]

    steps:
      - name: Wait for CI on main to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for CI workflow on main to succeed..."
          for i in $(seq 1 60); do
            RUN_JSON=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow CI \
              --branch main \
              --limit 1 \
              --json status,conclusion,databaseId)

            STATUS=$(echo "$RUN_JSON" | jq -r '.[0].status')
            CONCLUSION=$(echo "$RUN_JSON" | jq -r '.[0].conclusion')
            RUN_ID=$(echo "$RUN_JSON" | jq -r '.[0].databaseId')

            echo "CI run $RUN_ID: status=$STATUS conclusion=$CONCLUSION (attempt $i/60)"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "CI_RUN_ID=$RUN_ID" >> $GITHUB_ENV
                echo "CI passed!"
                exit 0
              else
                echo "::error::CI on main failed with conclusion: $CONCLUSION"
                exit 1
              fi
            fi

            sleep 30
          done
          echo "::error::Timed out waiting for CI on main (30 minutes)"
          exit 1

      - name: Download screenshots from CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          gh run download "$CI_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name ui-screenshots \
            --dir ci-artifacts
          mkdir -p ui-screenshots
          find ci-artifacts -name "*.png" -not -path "*/__reg__/*" -not -path "*/1_diff/*" -not -path "*/1_expected/*" -exec cp {} ui-screenshots/ \;
          zip -r "Vibits-${APP_VERSION#v}-screenshots.zip" ui-screenshots/

      - name: Upload screenshots to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.version }}
          files: Vibits-*-screenshots.zip

  build-apk:
    runs-on: ubuntu-latest
    needs: [await-main-checks, resolve-version]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: ./gradlew :app:android:assembleRelease -PappVersion=${APP_VERSION#v}

      - name: Rename APK
        env:
          APP_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          mv app/android/build/outputs/apk/release/android-release.apk \
             app/android/build/outputs/apk/release/Vibits-${APP_VERSION#v}.apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.version }}
          files: app/android/build/outputs/apk/release/Vibits-*.apk

      - name: Upload to Firebase App Distribution
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          APP_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > ${{ runner.temp }}/firebase-sa.json
          ./gradlew :app:android:appDistributionUploadRelease -PappVersion=${APP_VERSION#v}

  build-dmg:
    runs-on: macos-latest
    needs: [await-main-checks, resolve-version]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build DMG
        env:
          APP_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: ./gradlew :app:desktop:packageDmg -PappVersion=${APP_VERSION#v}

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.version }}
          files: app/desktop/build/compose/binaries/main/dmg/*.dmg

  update-homebrew:
    runs-on: ubuntu-latest
    needs: [build-dmg, resolve-version]

    steps:
      - name: Update Homebrew Cask
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          APP_VERSION="${VERSION#v}"
          DMG_URL="https://github.com/be1ski/vibits/releases/download/${VERSION}/Vibits-${APP_VERSION}.dmg"

          curl -sL "$DMG_URL" -o vibits.dmg
          SHA256=$(shasum -a 256 vibits.dmg | awk '{print $1}')
          rm vibits.dmg

          git clone "https://x-access-token:${COMMITTER_TOKEN}@github.com/be1ski/homebrew-tap.git" tap
          cd tap
          mkdir -p Casks

          cat > Casks/vibits.rb << CASK
          cask "vibits" do
            version "$APP_VERSION"
            sha256 "$SHA256"

            url "https://github.com/be1ski/vibits/releases/download/v#{version}/Vibits-#{version}.dmg"
            name "Vibits"
            desc "Habit tracker powered by Memos"
            homepage "https://be1ski.github.io/vibits/"

            depends_on macos: ">= :ventura"

            app "Vibits.app"

            postflight do
              system "xattr", "-cr", "#{appdir}/Vibits.app"
            end

            zap trash: [
              "~/Library/Application Support/Vibits",
              "~/Library/Preferences/space.be1ski.vibits.plist",
            ]
          end
          CASK

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/vibits.rb
          if ! git diff --staged --quiet; then
            git commit -m "vibits $APP_VERSION"
            git push
          fi

  build-msi:
    runs-on: windows-latest
    needs: [await-main-checks, resolve-version]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build MSI
        shell: bash
        env:
          APP_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: ./gradlew :app:desktop:packageMsi -PappVersion=${APP_VERSION#v}

      - name: Upload MSI to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.version }}
          files: app/desktop/build/compose/binaries/main/msi/*.msi

  build-web:
    runs-on: ubuntu-latest
    needs: [await-main-checks, resolve-version]
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Web Distribution
        run: ./gradlew :app:web:wasmJsBrowserDistribution

      - name: Create tarball
        env:
          APP_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          cd app/web/build/dist/wasmJs
          tar -czf Vibits-${APP_VERSION#v}-web.tar.gz productionExecutable

      - name: Upload Web to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.version }}
          files: app/web/build/dist/wasmJs/Vibits-*-web.tar.gz

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/web/build/dist/wasmJs/productionExecutable

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
