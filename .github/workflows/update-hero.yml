name: Update Hero Image

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  update-hero:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.HERO_PAT }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate hero image
        run: ./gradlew generateHeroImage

      - name: Publish to hero branch
        run: |
          cp build/hero/hero.webp /tmp/hero.webp
          git config user.name "automatedcolleague"
          git config user.email "automatedcolleague@users.noreply.github.com"
          git checkout --orphan hero
          git reset --hard
          git clean -fdx
          mv /tmp/hero.webp hero.webp
          git add hero.webp
          git commit -m "Update hero image"
          git push -f origin hero
