name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  check-jvm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run checks
        run: |
          START=$SECONDS
          xvfb-run ./gradlew checkJvm
          echo "BUILD_SECONDS=$((SECONDS - START))" >> "$GITHUB_ENV"

      - name: Generate coverage report
        run: ./gradlew koverXmlReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: "**/build/reports/tests/desktopTest/"
          retention-days: 7

      - name: Collect UI screenshots
        if: always()
        run: |
          mkdir -p build/ui-screenshots
          find . -path "*/build/ui-screenshots/*.png" -not -path "./build/*" -exec cp {} build/ui-screenshots/ \;

      - name: Visual regression test
        if: always()
        uses: reg-viz/reg-actions@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          image-directory-path: "./build/ui-screenshots"
          artifact-name: "ui-screenshots"
          comment-report-format: "summarized"
          outdated-comment-action: "minimize"
          enable-antialias: "true"
          retention-days: "7"

      - name: Parse build metrics
        if: github.event_name == 'push'
        run: |
          REPORT=$(find build/reports/kotlin-build -name "*.txt" | head -1)
          .github/scripts/parse-build-metrics.sh "$REPORT" "$BUILD_SECONDS" > benchmark-result.json

      - name: Store benchmark result
        if: github.event_name == 'push'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark-result.json
          gh-pages-branch: benchmark-data
          benchmark-data-dir-path: bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true

  check-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run iOS checks
        run: ./gradlew checkIos
