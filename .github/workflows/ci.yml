name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      ios-relevant: ${{ steps.filter.outputs.ios }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for iOS-relevant changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ios:
              - '**/platform/**'
              - '**/iosMain/**'
              - 'app/ios/**'

  check-jvm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/android/google-services.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run checks
        run: xvfb-run ./gradlew checkJvm

      - name: Generate coverage report
        run: ./gradlew koverXmlReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: "**/build/reports/tests/desktopTest/"
          retention-days: 7

      - name: Collect UI screenshots
        if: always()
        run: |
          mkdir -p build/ui-screenshots
          find . -path "*/build/ui-screenshots/*.png" -not -path "./build/*" -exec cp {} build/ui-screenshots/ \;

      - name: Visual regression test
        if: always()
        uses: reg-viz/reg-actions@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          image-directory-path: "./build/ui-screenshots"
          artifact-name: "ui-screenshots"
          comment-report-format: "summarized"
          outdated-comment-action: "update"
          enable-antialias: "true"
          retention-days: "7"

  check-ios:
    needs: detect-changes
    if: needs.detect-changes.outputs.ios-relevant == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run iOS checks
        run: ./gradlew checkIos

  update-hero:
    name: Update hero image
    runs-on: ubuntu-latest
    needs: [check-jvm, check-ios]
    if: |
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.check-jvm.result == 'success'
      && (needs.check-ios.result == 'success' || needs.check-ios.result == 'skipped')
    concurrency:
      group: hero-update-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.HERO_PAT }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install cwebp
        run: sudo apt-get install -y webp

      - name: Generate hero image
        run: xvfb-run ./gradlew generateHeroImage

      - name: Compare hero hash
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          for variant in dark light; do
            NEW_FILE="build/hero/hero-${variant}.webp"
            if [ ! -f "$NEW_FILE" ]; then
              echo "Missing generated file: $NEW_FILE"
              exit 1
            fi
          done

          NEW_HASH="$(cat build/hero/hero-dark.webp build/hero/hero-light.webp | sha256sum | cut -d' ' -f1)"

          OLD_HASH="none"
          if git fetch origin hero:refs/remotes/origin/hero 2>/dev/null; then
            if git cat-file -e origin/hero:hero-dark.webp 2>/dev/null && git cat-file -e origin/hero:hero-light.webp 2>/dev/null; then
              git show origin/hero:hero-dark.webp > /tmp/old-hero-dark.webp
              git show origin/hero:hero-light.webp > /tmp/old-hero-light.webp
              OLD_HASH="$(cat /tmp/old-hero-dark.webp /tmp/old-hero-light.webp | sha256sum | cut -d' ' -f1)"
            fi
          fi

          echo "new_hash=$NEW_HASH" >> "$GITHUB_OUTPUT"
          echo "old_hash=$OLD_HASH" >> "$GITHUB_OUTPUT"

          if [ "$NEW_HASH" = "$OLD_HASH" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Hero images unchanged, skip publish"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Hero images changed, publish required"
          fi

      - name: Publish hero branch
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Save generated images before branch switch cleans the working tree
          cp build/hero/hero-dark.webp /tmp/hero-dark.webp
          cp build/hero/hero-light.webp /tmp/hero-light.webp

          git config user.name "automatedcolleague"
          git config user.email "automatedcolleague@users.noreply.github.com"

          # Checkout existing hero branch, or create orphan if first time
          if git rev-parse --verify refs/remotes/origin/hero >/dev/null 2>&1; then
            git checkout -B hero origin/hero
          else
            git checkout --orphan hero
            git reset --hard
            git clean -fdx
          fi

          # Update images
          mv /tmp/hero-dark.webp hero-dark.webp
          mv /tmp/hero-light.webp hero-light.webp
          git add hero-dark.webp hero-light.webp
          git commit -m "Update hero images (${GITHUB_SHA::7})"

          # Prune: squash commits older than 7 days into a single root
          CUTOFF=$(date -d '7 days ago' +%s)
          OLDEST_RECENT=$(git log --reverse --format='%H %at' | while read hash ts; do
            if [ "$ts" -ge "$CUTOFF" ]; then echo "$hash"; break; fi
          done)

          if [ -n "$OLDEST_RECENT" ] && [ "$OLDEST_RECENT" != "$(git rev-list --max-parents=0 HEAD)" ]; then
            # Create new orphan root from OLDEST_RECENT's tree
            TREE=$(git rev-parse "${OLDEST_RECENT}^{tree}")
            DATE=$(git log -1 --format="%aI" "$OLDEST_RECENT")
            MSG=$(git log -1 --format="%s" "$OLDEST_RECENT")
            NEW_ROOT=$(GIT_AUTHOR_DATE="$DATE" GIT_COMMITTER_DATE="$DATE" git commit-tree "$TREE" -m "$MSG")

            if [ "$OLDEST_RECENT" = "$(git rev-parse HEAD)" ]; then
              git reset --hard "$NEW_ROOT"
            else
              git rebase --onto "$NEW_ROOT" "$OLDEST_RECENT"
            fi
          fi

          git push -f origin hero
