name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-jvm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run checks
        run: xvfb-run ./gradlew checkJvm

      - name: Generate coverage report
        run: ./gradlew koverXmlReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: "**/build/reports/tests/desktopTest/"
          retention-days: 7

      - name: Collect UI screenshots
        if: always()
        run: |
          mkdir -p build/ui-screenshots
          find . -path "*/build/ui-screenshots/*" -name "*.png" | while read -r f; do
            rel=$(echo "$f" | sed 's|.*/build/ui-screenshots/||')
            mkdir -p "build/ui-screenshots/$(dirname "$rel")"
            cp "$f" "build/ui-screenshots/$rel"
          done

      - name: Upload screenshots to Argos
        if: always()
        run: npx --yes @argos-ci/cli upload build/ui-screenshots/
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}

  check-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run iOS checks
        run: ./gradlew checkIos
