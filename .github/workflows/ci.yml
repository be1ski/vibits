name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  check-jvm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run checks
        run: xvfb-run ./gradlew checkJvm

      - name: Generate coverage report
        run: ./gradlew koverXmlReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: "**/build/reports/tests/desktopTest/"
          retention-days: 7

      - name: Collect UI screenshots
        if: always()
        run: |
          mkdir -p build/ui-screenshots
          find . -path "*/build/ui-screenshots/*.png" -not -path "./build/*" -exec cp {} build/ui-screenshots/ \;

      - name: Collect hero candidates manifest
        if: always()
        run: |
          FILES=$(find . -path "*/build/ui-screenshots/hero-candidates.txt" -not -path "./build/*")
          if [ -n "$FILES" ]; then
            cat $FILES > build/ui-screenshots/hero-candidates.txt
          fi

      - name: Upload hero candidates
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hero-candidates
          path: build/ui-screenshots/hero-candidates.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Visual regression test
        if: always()
        uses: reg-viz/reg-actions@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          image-directory-path: "./build/ui-screenshots"
          artifact-name: "ui-screenshots"
          comment-report-format: "summarized"
          outdated-comment-action: "minimize"
          enable-antialias: "true"
          retention-days: "7"

  check-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run iOS checks
        run: ./gradlew checkIos
